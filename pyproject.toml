[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-microstructure-agent"
version = "0.1.0"
description = "Real-time DEX market-microstructure analyzer with CAS integration"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.15",
    "websockets>=12.0",
    "eth-abi>=5.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
pipeline = [
    "redis>=5.0",
    # "aiokafka>=0.10",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lob_microstructure*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
