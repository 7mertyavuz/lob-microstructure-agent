<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEX Balina/MEV Canlı Panel</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --line:#222b39; --txt:#e6edf3; --muted:#8b97a7;
    --whale:#3fb6ff; --mev:#ff7a59; --retail:#9aa6b2;
    --up:#2ec27e; --down:#ff5470; --flat:#c7a64a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600}
  #status{font-size:12px;color:var(--muted)}
  #status.on{color:var(--up)} #status.off{color:var(--down)}
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
           color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  /* feed */
  #feed{max-height:70vh;overflow:auto}
  .row{display:grid;grid-template-columns:84px 56px 1fr 90px 56px;gap:8px;align-items:center;
       padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .row:hover{background:#1a2230}
  .tag{font-weight:700;font-size:11px;padding:2px 8px;border-radius:20px;text-align:center}
  .WHALE{color:var(--whale);background:rgba(63,182,255,.12)}
  .MEV_BOT{color:var(--mev);background:rgba(255,122,89,.12)}
  .RETAIL{color:var(--retail);background:rgba(154,166,178,.12)}
  .side{font-size:11px;color:var(--muted)}
  .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .usd{text-align:right;font-variant-numeric:tabular-nums}
  .conf{text-align:right;color:var(--muted);font-size:12px}
  /* predictions */
  .pred{padding:12px 14px;border-bottom:1px solid var(--line)}
  .pred .top{display:flex;justify-content:space-between;align-items:baseline}
  .pred .tok{font-weight:600}
  .dir{font-weight:700}
  .YUKARI{color:var(--up)} .AŞAĞI{color:var(--down)} .NÖTR{color:var(--flat)}
  .bar{height:8px;border-radius:6px;background:#0c1118;margin-top:8px;overflow:hidden;position:relative}
  .bar .fill{height:100%;transition:width .4s ease}
  .pmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
  .empty{padding:24px 14px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>🐋 DEX Balina / MEV Canlı Panel</h1>
  <div id="status" class="off">● bağlanılıyor…</div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Canlı Sinyal Akışı (Katman 3)</h2>
    <div id="feed"><div class="empty">Sinyal bekleniyor…</div></div>
  </div>
  <div class="card">
    <h2>Yön Tahmini (Katman 5)</h2>
    <div id="preds"><div class="empty">Tahmin bekleniyor…</div></div>
  </div>
</div>

<script>
const WS_URL = "ws://localhost:8765";
const feed = document.getElementById("feed");
const preds = document.getElementById("preds");
const status = document.getElementById("status");
const MAX_ROWS = 80;
const predState = {};   // token -> element

function usd(n){ return "$" + Math.round(n).toLocaleString("en-US"); }

function addSignal(d){
  if(feed.querySelector(".empty")) feed.innerHTML = "";
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <span class="tag ${d.label}">${d.label}</span>
    <span class="side">${d.side}</span>
    <span class="meta">${d.dex}:${d.method} · ${d.address.slice(0,10)}…</span>
    <span class="usd">${usd(d.est_value_usd)}</span>
    <span class="conf">%${Math.round(d.confidence*100)}</span>`;
  feed.prepend(row);
  while(feed.children.length > MAX_ROWS) feed.removeChild(feed.lastChild);
}

function upsertPred(d){
  if(preds.querySelector(".empty")) preds.innerHTML = "";
  let el = predState[d.token];
  if(!el){
    el = document.createElement("div");
    el.className = "pred";
    preds.appendChild(el);
    predState[d.token] = el;
  }
  const pct = Math.round(d.prob_up*100);
  const color = d.direction==="YUKARI" ? "var(--up)" : d.direction==="AŞAĞI" ? "var(--down)" : "var(--flat)";
  el.innerHTML = `
    <div class="top">
      <span class="tok">${d.token}</span>
      <span class="dir ${d.direction}">${d.direction} · %${pct}</span>
    </div>
    <div class="bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="pmeta">
      <span>imbalance ${d.flow_imbalance>=0?"+":""}${d.flow_imbalance.toFixed(2)}</span>
      <span>balina net ${usd(d.whale_net_usd)}</span>
      <span>n=${d.sample_count}/${Math.round(d.window_sec)}s</span>
    </div>`;
}

function connect(){
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { status.textContent = "● bağlı"; status.className = "on"; };
  ws.onclose = () => {
    status.textContent = "● bağlantı koptu, yeniden deneniyor…"; status.className = "off";
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if(m.kind === "signal") addSignal(m.data);
    else if(m.kind === "prediction") upsertPred(m.data);
  };
}
connect();
</script>
</body>
</html>
